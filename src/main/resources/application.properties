vaadin.launch-browser=true
spring.application.name=recipeplan

# --- Spring AI (a chave nunca vai para o repositorio) ---
# A chave vem da variavel de ambiente OPENAI_API_KEY ou do arquivo local.properties
# (ignorado pelo Git; veja local.properties.example).
spring.config.import=optional:file:./local.properties
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}

# Padrao: Groq (gratuito, API compativel com a da OpenAI).
# Para usar a OpenAI, defina OPENAI_BASE_URL=https://api.openai.com e OPENAI_MODEL=gpt-4o-mini
spring.ai.openai.chat.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openai/gpt-oss-120b}
